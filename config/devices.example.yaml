# Copia este archivo a devices.yaml y ajústalo.
# Los valores ${VAR} se resuelven desde variables de entorno (.env).
devices:
  - id: parlantes
    name: Parlantes
    type: tuya
    audio: true   # alimenta parlantes: al apagar pausa la música antes (sin "pop")
    device_id: ${TUYA_PARLANTES_ID}
    address: 192.168.1.50
    local_key: ${TUYA_PARLANTES_KEY}
    version: "3.5"
  - id: foco
    name: Foco
    type: tapo    # Tapo / Kasa (python-kasa); detecta protocolo y cifrado solo
    address: 192.168.1.51
    username: ${TAPO_USERNAME}   # cuenta TP-Link (la de la app Tapo)
    password: ${TAPO_PASSWORD}
  - id: demo
    name: Dispositivo de prueba
    type: fake

# Opcional: dispositivos Bluetooth a los que se conecta el SERVIDOR (ver docs/bluetooth-audio.md)
bluetooth:
  - id: parlantes
    name: Parlantes
    address: AA:BB:CC:DD:EE:FF

# Opcional: escenas (lista de pasos: power, toggle, light, bluetooth, media, wake, wait)
scenes:
  musica:
    - power: { device: parlantes, on: true }
    - wait: 4
    - bluetooth: { id: parlantes, connect: true }
    - media: { action: play_search, query: "Nombre de un artista", focus: artist }
  apagar_todo:
    - power: { device: parlantes, on: false }
    - power: { device: foco, on: false }
  noche:
    - mode: night
    - light: { device: foco, brightness: 15, color_temp: 2500 }   # cálida y tenue
    - power: { device: parlantes, on: true }
    - wait: 4
    - bluetooth: { id: parlantes, connect: true }
    - spotify: { play: "nombre de playlist", type: playlist, shuffle: true }
    - timer: { device: parlantes, minutes: 45 }   # el enchufe apaga los parlantes solo
  dia:
    - mode: day
    - light: { device: foco, brightness: 100, color_temp: 5000 }  # o hue/saturation para color
    - spotify: { uri: "spotify:playlist:XXXXXXXX", type: playlist }

# Opcional: rutinas; ejecutan la escena cuya ventana horaria contiene la hora actual
# (from inclusivo, to exclusivo; from > to cruza la medianoche)
routines:
  cama:
    - { from: "22:00", to: "06:30", scene: noche }
    - { from: "06:30", to: "22:00", scene: dia }
