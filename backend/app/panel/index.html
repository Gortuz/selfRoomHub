<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0b0e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Cuarto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bungee&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="panel.css">
</head>
<body class="idle">
  <main class="panel">
    <figure class="cover" id="cover" aria-hidden="true"></figure>

    <section class="stage">
      <header class="bar">
        <time id="clock" class="clock" title="Mantén presionado para abrir Ajustes">--:--</time>
        <p id="date" class="date"></p>
        <button id="speakers" class="speakers" type="button" aria-haspopup="dialog" aria-pressed="false">
          <span class="led" aria-hidden="true"></span>Parlantes
        </button>
      </header>

      <div class="poster" id="track" aria-live="polite">
        <h1 id="title" class="title"></h1>
        <p id="version" class="version" hidden></p>
        <p id="artist" class="artist"></p>
      </div>

      <div class="deck" id="transport" hidden>
        <button class="key" id="prev" type="button" aria-label="Canción anterior">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.5v14H6zM20 5v14L9.5 12z"/></svg>
        </button>
        <button class="key key-main" id="playpause" type="button" aria-label="Reproducir">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-play"><path d="M7 4.5v15l12.5-7.5z"/></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-pause"><path d="M6 4.5h4.5v15H6zM13.5 4.5H18v15h-4.5z"/></svg>
        </button>
        <button class="key" id="next" type="button" aria-label="Canción siguiente">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5H18v14h-2.5zM4 5v14l10.5-7z"/></svg>
        </button>

      </div>

      <p id="notice" class="notice" role="status" hidden></p>
    </section>

    <aside class="channel" id="fader" aria-label="Volumen" hidden>
      <button class="step" id="vol-up" type="button" aria-label="Subir volumen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4h3v6.5H20v3h-6.5V20h-3v-6.5H4v-3h6.5z"/></svg>
      </button>
      <div class="rail" id="volume" role="slider" tabindex="0" aria-label="Volumen"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-orientation="vertical">
        <div class="rail-fill" id="rail-fill"></div>
        <div class="rail-cap" id="rail-cap"></div>
      </div>
      <button class="step" id="vol-down" type="button" aria-label="Bajar volumen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5h16v3H4z"/></svg>
      </button>
      <output id="volume-value" class="channel-value">–</output>
    </aside>
  </main>

  <div class="sheet-backdrop" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <h2 id="sheet-title" class="sheet-title">Parlantes</h2>
      <dl class="facts">
        <div><dt>Corriente</dt><dd id="fact-power">…</dd></div>
        <div><dt>Audio</dt><dd id="fact-audio">…</dd></div>
      </dl>
      <p id="sheet-message" class="sheet-message" role="status" hidden></p>
      <div class="sheet-actions">
        <button id="act-power" class="action action-primary" type="button">Apagar parlantes</button>
        <button id="act-audio" class="action" type="button" hidden>Traer el audio aquí</button>
        <button id="act-close" class="action action-quiet" type="button">Cerrar</button>
      </div>
    </div>
  </div>

  <div id="setup" class="setup" hidden>
    <form id="setup-form" class="setup-form">
      <label for="setup-token" class="setup-title">Pega el token del servidor</label>
      <p class="setup-help">Es el de <code>SELFROOMHUB_TOKEN</code> en <code>backend/.env</code>. Se guarda en este equipo y no se vuelve a pedir.</p>
      <input id="setup-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <p id="setup-error" class="setup-error" role="alert" hidden></p>
      <button type="submit" class="action action-primary">Guardar</button>
    </form>
  </div>

  <script src="panel.js"></script>
</body>
</html>
