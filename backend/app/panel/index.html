<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17212C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Cuarto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="panel.css">
</head>
<body class="idle">
  <div class="backdrop" aria-hidden="true"></div>

  <main class="panel">
    <figure class="cover" id="cover" aria-hidden="true"></figure>

    <section class="info">
      <time id="clock" class="clock" title="Mantén presionado para abrir Ajustes">--:--</time>
      <p id="date" class="date"></p>

      <div class="track" id="track" aria-live="polite">
        <p id="title" class="title"></p>
        <p id="artist" class="artist"></p>
      </div>

      <div class="controls">
        <button id="power" class="switch" type="button" aria-pressed="false">
          <span class="led" aria-hidden="true"></span>
          <span class="switch-text">
            <span class="switch-name">Parlantes</span>
            <span class="switch-state" id="power-state">…</span>
          </span>
        </button>

        <button id="audio" class="switch" type="button" aria-pressed="false">
          <span class="led" aria-hidden="true"></span>
          <span class="switch-text">
            <span class="switch-name">Audio</span>
            <span class="switch-state" id="audio-state">…</span>
          </span>
        </button>
      </div>

      <p id="notice" class="notice" role="status" hidden></p>
    </section>
  </main>

  <div id="setup" class="setup" hidden>
    <p>Falta el token. Abre este panel como <code>/panel/#token=TU_TOKEN</code>; se guarda en este equipo y no hace falta repetirlo.</p>
  </div>

  <script src="panel.js"></script>
</body>
</html>
