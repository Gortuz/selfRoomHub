<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17212C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Cuarto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="panel.css">
</head>
<body class="idle">
  <div class="backdrop" aria-hidden="true"></div>

  <main class="panel">
    <figure class="cover" id="cover" aria-hidden="true"></figure>

    <section class="info">
      <div class="top">
        <div>
          <time id="clock" class="clock" title="Mantén presionado para abrir Ajustes">--:--</time>
          <p id="date" class="date"></p>
        </div>
        <button id="speakers" class="chip" type="button" aria-haspopup="dialog" aria-pressed="false">
          <span class="led" aria-hidden="true"></span>Parlantes
        </button>
      </div>

      <div class="track" id="track" aria-live="polite">
        <p id="title" class="title"></p>
        <p id="artist" class="artist"></p>
      </div>

      <div class="transport" id="transport" hidden>
        <button class="key" id="prev" type="button" aria-label="Canción anterior">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
        </button>
        <button class="key key-main" id="playpause" type="button" aria-label="Reproducir">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-play"><path d="M7 4v16l13-8z"/></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-pause"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
        </button>
        <button class="key" id="next" type="button" aria-label="Canción siguiente">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
        </button>

        <label class="fader" id="fader" hidden>
          <span class="fader-label">Volumen <output id="volume-value">–</output></span>
          <input id="volume" type="range" min="0" max="100" step="1" value="0">
        </label>
      </div>

      <p id="notice" class="notice" role="status" hidden></p>
    </section>
  </main>

  <div class="sheet-backdrop" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <h2 id="sheet-title" class="sheet-title">Parlantes</h2>
      <dl class="facts">
        <div><dt>Corriente</dt><dd id="fact-power">…</dd></div>
        <div><dt>Audio</dt><dd id="fact-audio">…</dd></div>
      </dl>
      <p id="sheet-message" class="sheet-message" role="status" hidden></p>
      <div class="sheet-actions">
        <button id="act-power" class="action action-primary" type="button">Apagar parlantes</button>
        <button id="act-audio" class="action" type="button" hidden>Traer el audio aquí</button>
        <button id="act-close" class="action action-quiet" type="button">Cerrar</button>
      </div>
    </div>
  </div>

  <div id="setup" class="setup" hidden>
    <p>Falta el token. Abre este panel como <code>/panel/#token=TU_TOKEN</code>; se guarda en este equipo y no hace falta repetirlo.</p>
  </div>

  <script src="panel.js"></script>
</body>
</html>
