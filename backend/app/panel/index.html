<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0b0e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Cuarto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bungee&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="panel.css">
</head>
<body class="idle">
  <div class="views" id="views" data-view="1">
  <section class="view lyrics" id="view-lyrics" aria-label="Letra">
    <header class="lyrics-head">
      <figure class="lyrics-cover" id="lyrics-cover" aria-hidden="true"></figure>
      <div class="lyrics-meta">
        <p class="lyrics-title marquee"><span id="lyrics-title"></span></p>
        <p class="lyrics-artist marquee"><span id="lyrics-artist"></span></p>
      </div>
    </header>
    <div class="lyrics-scroll" id="lyrics-scroll">
      <ol class="lyrics-lines" id="lyrics-lines"></ol>
      <p class="lyrics-state" id="lyrics-state">No suena nada.</p>
    </div>
  </section>

  <main class="panel view" id="view-music" aria-label="Música">
    <figure class="cover" id="cover" aria-hidden="true"></figure>

    <section class="stage">
      <header class="bar">
        <time id="clock" class="clock" title="Mantén presionado para abrir Ajustes">--:--</time>
        <p id="date" class="date"></p>
        <span class="battery" id="battery" hidden></span>
        <span class="sleep-timer" id="sleep-timer" hidden></span>
      </header>

      <div class="poster" id="track" aria-live="polite">
        <h1 id="title" class="title"></h1>
        <p id="version" class="version" hidden></p>
        <p id="artist" class="artist"></p>
      </div>

      <div class="deck">
        <div class="keys" id="transport" hidden>
        <button class="key" id="prev" type="button" aria-label="Canción anterior">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.5v14H6zM20 5v14L9.5 12z"/></svg>
        </button>
        <button class="key key-main" id="playpause" type="button" aria-label="Reproducir">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-play"><path d="M7 4.5v15l12.5-7.5z"/></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-pause"><path d="M6 4.5h4.5v15H6zM13.5 4.5H18v15h-4.5z"/></svg>
        </button>
        <button class="key" id="next" type="button" aria-label="Canción siguiente">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5H18v14h-2.5zM4 5v14l10.5-7z"/></svg>
        </button>
        </div>
        <button id="speakers" class="speakers" type="button" aria-haspopup="dialog" aria-pressed="false">
          <span class="led" aria-hidden="true"></span>Parlantes
        </button>
      </div>

      <p id="notice" class="notice" role="status" hidden></p>
    </section>

    <aside class="channel" id="fader" aria-label="Volumen" hidden>
      <button class="step" id="vol-up" type="button" aria-label="Subir volumen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 4h3v6.5H20v3h-6.5V20h-3v-6.5H4v-3h6.5z"/></svg>
      </button>
      <div class="rail" id="volume" role="slider" tabindex="0" aria-label="Volumen"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-orientation="vertical">
        <div class="rail-fill" id="rail-fill"></div>
        <div class="rail-cap" id="rail-cap"></div>
      </div>
      <button class="step" id="vol-down" type="button" aria-label="Bajar volumen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5h16v3H4z"/></svg>
      </button>
      <output id="volume-value" class="channel-value">–</output>
    </aside>
  </main>

  <section class="view sky" id="view-clock" aria-label="Reloj">
    <svg class="sky-art" id="sky-art" viewBox="0 0 1600 740" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
    <div class="sky-time">
      <time id="sky-clock" class="sky-clock">--:--</time>
      <p id="sky-date" class="sky-date"></p>
      <span class="battery battery-sky" id="sky-battery" hidden></span>
      <p class="sky-timer" id="sky-timer" hidden></p>
    </div>

    <aside class="channel channel-light" id="light" aria-label="Brillo" hidden>
      <button class="step" id="light-up" type="button" aria-label="Más brillo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M11 1.5h2v4h-2zM11 18.5h2v4h-2zM1.5 11h4v2h-4zM18.5 11h4v2h-4zM4.2 5.6l1.4-1.4 2.8 2.8-1.4 1.4zM15.6 17l1.4-1.4 2.8 2.8-1.4 1.4zM4.2 18.4l2.8-2.8 1.4 1.4-2.8 2.8zM15.6 7l2.8-2.8 1.4 1.4-2.8 2.8z"/></svg>
      </button>
      <div class="rail" id="light-rail" role="slider" tabindex="0" aria-label="Brillo"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="60" aria-orientation="vertical">
        <div class="rail-fill" id="light-fill"></div>
        <div class="rail-cap" id="light-cap"></div>
      </div>
      <button class="step" id="light-down" type="button" aria-label="Menos brillo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M11 3.5h2v3h-2zM11 17.5h2v3h-2zM3.5 11h3v2h-3zM17.5 11h3v2h-3z"/></svg>
      </button>
      <output id="light-value" class="channel-value">–</output>
    </aside>
  </section>
  </div>

  <div class="dots" aria-hidden="true">
    <span class="dot" data-go="0"></span>
    <span class="dot" data-go="1"></span>
    <span class="dot" data-go="2"></span>
  </div>

  <div class="sheet-backdrop" id="sheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <h2 id="sheet-title" class="sheet-title">Parlantes</h2>
      <dl class="facts">
        <div><dt>Corriente</dt><dd id="fact-power">…</dd></div>
        <div><dt>Audio</dt><dd id="fact-audio">…</dd></div>
        <div id="fact-timer-row" hidden><dt>Temporizador</dt><dd id="fact-timer">…</dd></div>
      </dl>
      <p id="sheet-message" class="sheet-message" role="status" hidden></p>
      <div class="sheet-actions">
        <button id="act-power" class="action action-primary" type="button">Apagar parlantes</button>
        <button id="act-audio" class="action" type="button" hidden>Traer el audio aquí</button>
        <button id="act-timer" class="action" type="button" hidden>Cancelar temporizador</button>
        <button id="act-close" class="action action-quiet" type="button">Cerrar</button>
      </div>
    </div>
  </div>

  <div id="setup" class="setup" hidden>
    <form id="setup-form" class="setup-form">
      <label for="setup-token" class="setup-title">Pega el token del servidor</label>
      <p class="setup-help">Es el de <code>SELFROOMHUB_TOKEN</code> en <code>backend/.env</code>. Se guarda en este equipo y no se vuelve a pedir.</p>
      <input id="setup-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" required>
      <p id="setup-error" class="setup-error" role="alert" hidden></p>
      <button type="submit" class="action action-primary">Guardar</button>
    </form>
  </div>

  <script src="panel.js"></script>
</body>
</html>
